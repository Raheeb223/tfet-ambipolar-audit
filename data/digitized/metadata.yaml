  doi_or_url: none (dissertation, Univ. of Notre Dame library, April 2007)
  figure: Fig. 2.3
  curve_label: Fair & Wivell 1976, As-implanted n+p, reverse bias -1 V
  x_quantity: electric_field
  x_unit: MV/cm
  y_quantity: current_density
  y_unit: A/cm2
  y_scale: log
  temperature_K: 300
  bias_direction: reverse
  doping_info: one-sided n+p junctions; F = peak junction field from SIMS / C-V (original papers)
  area_um2: null
  digitizer_repeats: 1
  est_error: 'vector PDF: exact path coordinates; marker-centre convention +-0.04 decade'
  role: core_calibration
