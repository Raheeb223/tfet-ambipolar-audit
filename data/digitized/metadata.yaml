# Metadata for every digitized curve (HANDOFF §7 rules, §11 fields).
# One entry per CSV in this folder. CSV = two numeric columns with a header row,
# in the units given here, e.g.
#   V,J
#   -0.10,1.2e-3
#
# Validate with:  python -m src.dataio.digitized
#
# Roles:
#   core_calibration  fit parameters (Solomon 2004, Li & Sturm 2013, Zhao thesis Fig 2.3)
#   temperature       temperature checks, no refitting (Zhao Fig 3.20, Ge TAT study)
#   validation        device comparison only, NEVER fit (Wan 2011, Zhao JEDS 2015, Narimani 2018)
#   sanity            sign/trend checks only, never fit (datasheets, 1960s Ge)
#   context           plotted for context only
#
# Template (copy, uncomment, fill in. Never invent numbers: every value comes from the source):
#
# - file: solomon2004_fig4_Q5_300K_rev.csv
#   source: "Solomon et al., J. Appl. Phys. 95, 5800 (2004); IBM RC22916"
#   doi_or_url: "https://dominoweb.draco.res.ibm.com/reports/rc22916.pdf"
#   figure: "Fig. 4"
#   curve_label: "sample Q5, 300 K"
#   x_quantity: voltage
#   x_unit: V
#   y_quantity: current_density
#   y_unit: A/cm2
#   y_scale: log
#   temperature_K: 300
#   bias_direction: reverse
#   doping_info: "see Table 1 / SIMS Fig. 3"
#   area_um2: null
#   digitizer_repeats: 3
#   est_error: "x: +-0.01 V; y: +-5 % (one log-axis pixel ~ 0.02 decade)"
#   role: core_calibration

datasets:
- file: zhao2007_fig2p3_fair.csv
